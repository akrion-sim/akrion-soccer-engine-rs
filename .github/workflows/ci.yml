name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The crate depends on a sibling path crate:
#   des_engine -> ../discrete-event-system.rs (public: ORESoftware/discrete-event-system.rs)
# so it must sit alongside this repo for cargo to resolve it.
#
# NOTE on tests: CI executes the full `cargo test --lib` suite in the
# `main-crate-known-red` job below, preserving its real failing result and logs.
# The job is explicitly an allowed failure because main carries ~164 known-red
# behavioral and parallel-sensitive tests whose membership is not stable enough
# for a count or name allowlist. The reliable compile/lifecycle/fmt/Clippy and
# hermetic standalone-5v5 jobs remain blocking while DEN-1229 tracks the debt.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owner-authorized-mcp-publication:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.user.login == 'ORESoftware' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/publish-oresoftware-mcp-rust-libs-20260731'
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Execute exact pinned ORESoftware MCP publisher
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-oresoftware-mcp-rust-libs.sh

  compile:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.ref != 'agent/publish-oresoftware-mcp-rust-libs-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Actions are pinned to commit SHAs (supply-chain hardening); the trailing
      # comment records the human-readable version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: akrion-soccer-engine.rs
          persist-credentials: false
      - name: Formal match manifest and lifecycle model
        working-directory: akrion-soccer-engine.rs
        run: python3 formal/match_model.py
      - name: Formal match JSON-lines replay witness
        working-directory: akrion-soccer-engine.rs
        run: |
          printf '%s\n' \
            '{"op":"replay","events":["start","home_goal","restart","tick","finish"]}' \
            | python3 formal/match_model.py --json-stdin
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/discrete-event-system.rs
          path: discrete-event-system.rs
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: akrion-soccer-engine.rs
      - name: Formal production lifecycle unit tests
        working-directory: akrion-soccer-engine.rs
        run: cargo test --lib des::general::soccer::lifecycle::tests
      - name: Formal model-to-Rust debug/release refinement
        working-directory: akrion-soccer-engine.rs
        run: python3 formal/compare_match_replay.py
      - name: check (lib + bins + tests compile)
        working-directory: akrion-soccer-engine.rs
        run: cargo check --all-targets
      # `cargo fmt --check` is clean on main, so it is a plain blocking gate.
      - name: fmt
        working-directory: akrion-soccer-engine.rs
        run: cargo fmt --check

      # Clippy is gated by a RATCHET, not by `continue-on-error`.
      #
      # `cargo clippy --all-targets -- -D warnings` reports 608 pre-existing
      # findings here, concentrated in the large restored legacy files
      # (src/des/general/soccer/tests.rs, .../world.rs, .../soccer.rs,
      # src/des/soccer_learning.rs). Clearing them is a real but separate job.
      #
      # This step used to carry `continue-on-error: true`, which is strictly
      # worse than having no step: it burned CI minutes to produce a green check
      # mark that carried no information, and it hid every NEW finding behind the
      # old ones. scripts/clippy_ratchet.py is the honest version — it records
      # today's findings per (file, lint) in scripts/clippy-baseline.json and
      #   * FAILS if any count rises or a new (file, lint) pair appears, so new
      #     code is held to the full `-D warnings` standard;
      #   * FAILS if a count drops without the baseline being lowered to match,
      #     so repaid debt is booked and the budget can only ever shrink.
      # Never add an entry to the baseline to get green — fix the finding.
      - name: clippy (ratcheting baseline, fails on any NEW finding)
        working-directory: akrion-soccer-engine.rs
        run: python3 scripts/clippy_ratchet.py

  # DEN-1229: execute the complete main-crate library suite on every CI run.
  # Keep the actual `cargo test` exit status: a failing suite produces a failing
  # job rather than a green wrapper step. Job-level `continue-on-error` makes
  # that known-red result non-blocking without hiding it. Do not replace this
  # with a count or test-name allowlist; repeated runs have shown the failure
  # membership is parallel/timing-sensitive even at the same commit.
  main-crate-known-red:
    name: main crate cargo test --lib (known-red, allowed failure)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.ref != 'agent/publish-oresoftware-mcp-rust-libs-20260731'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: akrion-soccer-engine.rs
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/discrete-event-system.rs
          path: discrete-event-system.rs
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: akrion-soccer-engine.rs
      - name: Execute full main-crate library suite (known-red)
        working-directory: akrion-soccer-engine.rs
        run: cargo test --lib

  # The standalone 5v5 demo is hermetic (zero deps, own [workspace] table), so
  # its suite is fast and reliably green — a real blocking gate.
  standalone-5v5:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.ref != 'agent/publish-oresoftware-mcp-rust-libs-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: standalone-5v5
      - name: test
        working-directory: standalone-5v5
        run: cargo test
