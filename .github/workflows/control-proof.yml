name: Deterministic soccer controller proof
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deterministic-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustc --version && cargo --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Measured local scenario microbenchmark
        run: cargo run --release --example control_benchmark
